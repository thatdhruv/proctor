[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proctor-rl"
version = "0.1.0"
description = "Contained, red-teamed RL environments: sandboxed execution, hardened verifiers, cheating-rate metrics."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "psycopg[binary]>=3.2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "gymnasium>=0.29"]
llm = ["anthropic>=0.40"]
envharness = ["envharness @ git+https://github.com/google-research/envharness"]

[project.scripts]
proctor = "proctor.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["proctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_core: requires the built C++ core (Linux)", "needs_postgres: requires a Postgres server"]
