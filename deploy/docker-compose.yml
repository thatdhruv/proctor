# Local stack: Postgres + OpenTelemetry Collector + Tempo (traces) + Prometheus (metrics) + Grafana.
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml run --rm proctor rollouts --seconds 60
# Grafana: http://localhost:3000 (anonymous admin, local use only)
name: proctor

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: proctor, POSTGRES_PASSWORD: proctor, POSTGRES_DB: proctor }
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U proctor"], interval: 3s, retries: 20 }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel.yaml:ro"]
    ports: ["4318:4318", "8889:8889"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/proctor.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]

  # The execution core needs namespaces, mounts and cgroups; run it privileged inside this container only.
  proctor:
    build: { context: .., dockerfile: deploy/Dockerfile.proctor }
    image: proctor-runner
    profiles: ["run"]
    privileged: true
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PROCTOR_PG_DSN: postgresql://proctor:proctor@postgres:5432/proctor_envs
      PROCTOR_STORE_DSN: postgresql://proctor:proctor@postgres:5432/proctor
      PROCTOR_METRICS_PORT: "9464"
    depends_on: { postgres: { condition: service_healthy }, otel-collector: { condition: service_started } }
    volumes: ["../evidence:/opt/proctor/evidence"]
