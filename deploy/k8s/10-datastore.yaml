# Episode store + a "lateral movement" canary, both in the workers' namespace.
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: proctor-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: proctor }
            - { name: POSTGRES_PASSWORD, value: proctor }
            - { name: POSTGRES_DB, value: proctor }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "proctor"] }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: proctor-demo }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: canary, namespace: proctor-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: canary } }
  template:
    metadata: { labels: { app: canary } }
    spec:
      containers:
        - name: canary
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "8080"]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: canary, namespace: proctor-demo }
spec: { selector: { app: canary }, ports: [{ port: 8080 }] }
