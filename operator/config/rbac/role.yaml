---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proctor-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - proctor.dev
  resources:
  - proctorruns
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - proctor.dev
  resources:
  - proctorruns/finalizers
  verbs:
  - update
- apiGroups:
  - proctor.dev
  resources:
  - proctorruns/status
  verbs:
  - get
  - patch
  - update
